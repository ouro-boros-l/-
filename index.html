<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f3e8">
  <meta name="description" content="暖伴——为老年人设计的语音陪伴与生活照护网页原型，包含 25 个可交互页面。">
  <title>暖伴 · 老年人智能伴侣</title>
  <style>/* 暖伴 · visual system */
:root{
  --bg:#ece4d6;--app-bg:#f8f3e8;--surface:#fffdf7;--surface-2:#f4eadb;--surface-3:#ede0ce;
  --ink:#2c2721;--ink-soft:#6d6458;--ink-faint:#958b7d;--line:rgba(62,50,37,.14);--line-strong:rgba(62,50,37,.25);
  --primary:#b84f32;--primary-deep:#8e351f;--primary-soft:#f2d7c8;--sage:#536d58;--sage-deep:#3f5545;--sage-soft:#dfe8da;
  --gold:#dda94f;--gold-soft:#f8e9c4;--blue:#4e7080;--blue-soft:#dbe7ea;--danger:#a63a2b;--danger-soft:#f5d8d2;
  --fs:1;--r-xl:30px;--r-lg:22px;--r-md:16px;--shadow:0 18px 50px rgba(56,42,28,.13);--shadow-soft:0 8px 24px rgba(56,42,28,.07);
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","Source Han Sans SC",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E")}
button,input{font:inherit}button{color:inherit}button,.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid rgba(184,79,50,.38);outline-offset:3px}
button{border:0}svg{display:block}
.stage{position:relative;z-index:1;height:100dvh;min-height:620px;padding:24px clamp(28px,6vw,100px);display:grid;grid-template-columns:minmax(360px,1fr) auto;gap:clamp(36px,7vw,110px);align-items:center;overflow:hidden}
.stage::before{content:"";position:absolute;width:56vw;height:56vw;max-width:780px;max-height:780px;border-radius:50%;left:-16vw;bottom:-34vw;background:radial-gradient(circle at 38% 32%,rgba(221,169,79,.30),rgba(221,169,79,.07) 48%,transparent 70%);pointer-events:none}
.stage::after{content:"";position:absolute;right:clamp(300px,38vw,620px);top:9vh;width:1px;height:82vh;background:linear-gradient(transparent,rgba(62,50,37,.20) 18%,rgba(62,50,37,.20) 82%,transparent);pointer-events:none}
.intro{position:relative;z-index:2;max-width:590px}
.brandline{display:flex;align-items:center;gap:14px;margin-bottom:clamp(26px,5vh,56px)}
.brandmark{width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff2e8;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(184,79,50,.26)}
.brandmark svg{width:28px;height:28px}.brandname{font-size:16px;font-weight:800;letter-spacing:.18em}
.brandsub{font-size:10px;letter-spacing:.27em;color:var(--ink-soft);margin-top:3px;text-transform:uppercase}
.intro h1{margin:0;font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;font-size:clamp(52px,5.3vw,86px);line-height:1.05;letter-spacing:-.055em;font-weight:700;color:#28231e}
.intro h1 em{font-style:normal;color:var(--primary);position:relative}
.intro h1 em::after{content:"";position:absolute;left:2%;right:0;bottom:6%;height:10%;background:var(--gold);opacity:.38;z-index:-1;border-radius:99px}
.intro .lead{margin:26px 0 0;max-width:455px;font-size:18px;line-height:1.85;color:var(--ink-soft);letter-spacing:.01em}
.functions{display:grid;grid-template-columns:1fr 1fr;gap:0 34px;margin:clamp(26px,4.5vh,48px) 0 0;border-top:1px solid var(--line-strong)}
.function{padding:16px 0 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px}
.function b{font-size:11px;color:var(--primary);letter-spacing:.14em;font-weight:800}.function span{font-size:15px;font-weight:700;color:#3c352d}
.intro-bottom{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:clamp(24px,4vh,42px)}
.count{display:flex;align-items:baseline;gap:7px;color:var(--ink-soft);font-size:12px;letter-spacing:.10em}
.count strong{font-family:"Noto Serif SC","STSong",serif;font-size:34px;line-height:1;letter-spacing:-.04em;color:var(--ink);font-weight:700}
.map-btn{min-height:50px;padding:0 20px;border-radius:99px;background:transparent;border:1px solid var(--line-strong);display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:700;transition:.2s ease}
.map-btn:hover{background:#fff9ef;transform:translateY(-1px)}.map-btn svg{width:18px;height:18px}
.intro-note{margin:22px 0 0;font-size:11px;line-height:1.6;color:var(--ink-faint);letter-spacing:.04em}
.device-wrap{position:relative;z-index:3;display:flex;justify-content:center;filter:drop-shadow(0 42px 56px rgba(63,48,31,.16))}
.device{position:relative;height:min(844px,calc(100dvh - 48px));aspect-ratio:390/844;background:#211e1a;border-radius:52px;padding:9px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 0 0 1px rgba(40,32,23,.35),0 30px 80px rgba(49,37,25,.24)}
.device::before{content:"";position:absolute;top:17px;left:50%;transform:translateX(-50%);width:88px;height:23px;border-radius:99px;background:#15130f;z-index:20}
.device::after{content:"";position:absolute;right:-4px;top:212px;width:4px;height:74px;border-radius:0 4px 4px 0;background:#37312a}
.phone{position:relative;height:100%;width:100%;background:var(--app-bg);border-radius:43px;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.statusbar{height:35px;flex:none;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--ink);position:relative;z-index:12}
.statusbar.light{color:#fff9ee}.status-icons{display:flex;align-items:center;gap:6px;height:12px}.status-icons svg{height:11px;width:auto}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.page{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--app-bg)}
.page-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 22px 28px;scrollbar-width:none}
.page-scroll::-webkit-scrollbar{display:none}
.page.fade-in .page-scroll,.page.fade-in>.immersive-body{animation:pageRise .42s cubic-bezier(.2,.75,.25,1) both}
@keyframes pageRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.appbar{flex:none;min-height:66px;padding:5px 16px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(var(--app-bg) 68%,rgba(248,243,232,0));position:relative;z-index:8}
.appbar h2{font-size:calc(20px * var(--fs));line-height:1.2;margin:0;font-weight:800;letter-spacing:-.02em;flex:1}
.appbar .sub{font-size:calc(11px * var(--fs));color:var(--ink-soft);font-weight:600;margin-top:3px;letter-spacing:.05em}
.icon-btn{width:46px;height:46px;min-width:46px;border-radius:16px;background:rgba(255,253,247,.78);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:.18s ease}
.icon-btn:active{transform:scale(.94);background:var(--surface-2)}.icon-btn svg{width:23px;height:23px}
.appbar .text-btn{border:1px solid var(--line);background:rgba(255,253,247,.8);border-radius:99px;min-height:38px;padding:0 14px;font-size:11px;font-weight:700}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;min-height:76px;padding:5px 7px calc(5px + env(safe-area-inset-bottom));background:rgba(255,253,247,.95);border-top:1px solid var(--line);backdrop-filter:blur(16px);position:relative;z-index:15}
.tab{background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft);border-radius:16px}
.tab-icon{height:31px;min-width:44px;display:flex;align-items:center;justify-content:center;border-radius:99px;transition:.2s ease}
.tab svg{width:22px;height:22px}.tab span{font-size:calc(10.5px * var(--fs));font-weight:700;letter-spacing:.02em}
.tab.active{color:var(--primary-deep)}.tab.active .tab-icon{background:var(--primary-soft)}.tab:active .tab-icon{transform:scale(.92)}
h1,h2,h3,p{margin-top:0}
.display{font-family:"Noto Serif SC","STSong","SimSun",serif;font-size:calc(31px * var(--fs));line-height:1.2;letter-spacing:-.04em;font-weight:700}
.h1{font-size:calc(27px * var(--fs));line-height:1.22;letter-spacing:-.035em;font-weight:800;margin:0 0 8px}
.h2{font-size:calc(21px * var(--fs));line-height:1.35;letter-spacing:-.02em;font-weight:800;margin:0}
.h3{font-size:calc(17px * var(--fs));line-height:1.4;font-weight:800;margin:0}
.body{font-size:calc(15.5px * var(--fs));line-height:1.65;color:var(--ink-soft)}
.small{font-size:calc(12px * var(--fs));line-height:1.5;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}.faint{color:var(--ink-faint)}.center{text-align:center}.stack{display:flex;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-soft)}
.card.flat{box-shadow:none}.card.tap{transition:.18s ease;text-align:left;width:100%}.card.tap:active{transform:scale(.982);box-shadow:none}
.btn{min-height:56px;padding:0 22px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:calc(16px * var(--fs));font-weight:800;letter-spacing:.01em;transition:.18s ease;text-decoration:none}
.btn svg{width:21px;height:21px}.btn:active{transform:scale(.975)}
.btn-primary{background:var(--primary);color:#fffaf3;box-shadow:0 9px 22px rgba(184,79,50,.24)}.btn-primary:hover{background:var(--primary-deep)}
.btn-sage{background:var(--sage);color:#fffdf7;box-shadow:0 9px 22px rgba(63,85,69,.18)}
.btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-outline{background:transparent;border:1.5px solid var(--line-strong);color:var(--ink)}
.btn-block{width:100%}.btn-row{display:flex;gap:10px}.btn-row>*{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:7px 12px;background:var(--surface-2);font-size:calc(11px * var(--fs));font-weight:700;color:var(--ink-soft)}
.pill svg{width:14px;height:14px}.dot{width:7px;height:7px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 3px rgba(83,109,88,.12);flex:none}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:26px 2px 12px}
.section-head h3{font-size:calc(17px * var(--fs));font-weight:800;margin:0}
.section-head button{background:none;font-size:calc(11.5px * var(--fs));font-weight:700;color:var(--primary);padding:4px}
.divider{height:1px;background:var(--line);margin:16px 0}
.avatar{position:relative;border-radius:50%;overflow:hidden;background:var(--sage-soft);flex:none;border:1px solid rgba(60,45,30,.10)}
.avatar svg{width:100%;height:100%}.avatar.small{width:44px;height:44px}.avatar.mid{width:58px;height:58px}.avatar.large{width:86px;height:86px}
.avatar-ring{padding:3px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1.5px var(--line)}.voice-card{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px;color:#fff8ee;background:linear-gradient(145deg,#c05b3a 0%,#ab4328 52%,#8f351e 100%);box-shadow:0 20px 38px rgba(143,53,30,.22)}
.voice-card::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-66px;top:-86px;border:1px solid rgba(255,255,255,.18)}
.voice-card::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-10px;bottom:-72px;background:rgba(255,231,196,.12)}
.voice-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.voice-top span{font-size:calc(11px * var(--fs));font-weight:800;letter-spacing:.16em;opacity:.74}
.mic-orb{width:66px;height:66px;border-radius:50%;background:#fff8ee;color:var(--primary-deep);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(255,248,238,.10);position:relative;z-index:2}
.mic-orb svg{width:30px;height:30px}
.voice-copy{position:relative;z-index:2;margin-top:18px}
.voice-copy b{display:block;font-family:"Noto Serif SC","STSong",serif;font-size:calc(27px * var(--fs));letter-spacing:-.05em;line-height:1.2;font-weight:700}
.voice-copy p{margin:7px 0 0;font-size:calc(12.5px * var(--fs));opacity:.76;line-height:1.55}
.wave{display:flex;align-items:center;gap:4px;height:30px;margin-top:17px;position:relative;z-index:2}
.wave i{display:block;width:4px;border-radius:99px;background:#ffe3c8;opacity:.85;animation:wave 1.1s ease-in-out infinite}
.wave i:nth-child(1){height:9px;animation-delay:-.1s}.wave i:nth-child(2){height:17px;animation-delay:-.25s}.wave i:nth-child(3){height:24px;animation-delay:-.4s}.wave i:nth-child(4){height:14px;animation-delay:-.55s}.wave i:nth-child(5){height:27px;animation-delay:-.7s}.wave i:nth-child(6){height:18px;animation-delay:-.85s}.wave i:nth-child(7){height:10px;animation-delay:-1s}
@keyframes wave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1.1)}}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.quick-card{min-height:126px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:var(--shadow-soft)}
.quick-card .qicon{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center}.quick-card .qicon svg{width:22px;height:22px}
.quick-card b{font-size:calc(15px * var(--fs));line-height:1.3;display:block;margin-top:12px}
.quick-card span{display:block;font-size:calc(11px * var(--fs));color:var(--ink-soft);margin-top:3px}
.q-terra{background:var(--primary-soft);color:var(--primary-deep)}.q-sage{background:var(--sage-soft);color:var(--sage-deep)}.q-gold{background:var(--gold-soft);color:#7a5315}.q-blue{background:var(--blue-soft);color:var(--blue)}
.quote-card{position:relative;overflow:hidden;border-radius:22px;background:var(--sage-soft);padding:19px 20px;color:var(--sage-deep);border:1px solid rgba(83,109,88,.13)}
.quote-card::after{content:"“";position:absolute;right:13px;top:-11px;font-family:Georgia,serif;font-size:86px;opacity:.12;line-height:1}
.quote-card p{margin:0;font-family:"Noto Serif SC","STSong",serif;font-size:calc(16px * var(--fs));line-height:1.65;font-weight:600}
.quote-card span{display:block;margin-top:9px;font-size:calc(10.5px * var(--fs));letter-spacing:.1em;opacity:.7}
.home-head{padding:2px 2px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.home-head .hello{font-size:calc(11px * var(--fs));letter-spacing:.14em;font-weight:800;color:var(--primary);margin-bottom:5px}
.home-head h1{font-family:"Noto Serif SC","STSong",serif;font-size:calc(28px * var(--fs));line-height:1.2;letter-spacing:-.045em;margin:0;font-weight:700}
.home-head p{margin:4px 0 0;font-size:calc(11.5px * var(--fs));color:var(--ink-soft)}
.weather{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:calc(11px * var(--fs));color:var(--ink-soft)}.weather svg{width:14px;height:14px;color:var(--gold)}
.home-avatar{width:55px;height:55px;border-radius:50%;padding:3px;background:var(--surface);box-shadow:0 0 0 1px var(--line);flex:none}
.next-reminder{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:20px;background:var(--gold-soft);border:1px solid rgba(122,83,21,.11);text-align:left;width:100%}
.next-reminder .time{font-family:"Noto Serif SC","STSong",serif;font-size:calc(23px * var(--fs));font-weight:700;color:#67430e;letter-spacing:-.04em;flex:none}
.next-reminder .nr-copy{flex:1;min-width:0}.next-reminder b{font-size:calc(13.5px * var(--fs));display:block;line-height:1.25;color:#4e350e}
.next-reminder span{font-size:calc(10.5px * var(--fs));color:#7b5d2e;display:block;margin-top:3px}
.next-reminder .go{width:35px;height:35px;border-radius:50%;background:#fff8e8;display:flex;align-items:center;justify-content:center;color:#6e4a12;flex:none}.next-reminder .go svg{width:17px;height:17px}
.reminder-item{display:flex;align-items:stretch;gap:13px;padding:15px;border-radius:20px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;box-shadow:var(--shadow-soft);transition:.18s ease}
.reminder-item:active{transform:scale(.985)}
.reminder-item .r-time{font-family:"Noto Serif SC","STSong",serif;font-size:calc(22px * var(--fs));line-height:1;font-weight:700;min-width:63px;color:var(--primary-deep);padding-top:2px}
.reminder-item .r-main{flex:1;min-width:0;border-left:1px solid var(--line);padding-left:13px}
.reminder-item h3{font-size:calc(15px * var(--fs));line-height:1.3;margin:0;font-weight:800}
.reminder-item p{font-size:calc(11px * var(--fs));line-height:1.5;color:var(--ink-soft);margin:4px 0 0}
.reminder-item.done{opacity:.63;background:var(--surface-2);box-shadow:none}.reminder-item.done h3{text-decoration:line-through;text-decoration-thickness:1.5px}
.reminder-check{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;align-self:center;flex:none;color:transparent}
.reminder-item.done .reminder-check{background:var(--sage);border-color:var(--sage);color:white}.reminder-check svg{width:17px;height:17px}
.progress-line{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress-line i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sage),#78927d);transition:width .5s ease}
.list-stack{display:flex;flex-direction:column;gap:10px}
.reminder-summary{display:flex;gap:13px;align-items:center;padding:6px 2px 16px}
.ring{--p:40;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--sage) calc(var(--p)*1%),var(--surface-3) 0);position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--app-bg)}
.ring b{position:relative;z-index:2;font-size:calc(13px * var(--fs));font-weight:800;color:var(--sage-deep)}.step-track{display:flex;align-items:center;gap:8px;margin:2px 0 18px}.step-track span{height:6px;flex:1;border-radius:99px;background:var(--surface-3)}.step-track span.on{background:var(--primary)}
.step-label{font-size:calc(10.5px * var(--fs));letter-spacing:.1em;font-weight:800;color:var(--primary);margin-bottom:9px}
.big-time{font-family:"Noto Serif SC","STSong",serif;font-size:calc(64px * var(--fs));line-height:1;letter-spacing:-.06em;font-weight:700;text-align:center;margin:10px 0 4px;color:var(--ink)}
.big-time small{font-size:calc(24px * var(--fs));letter-spacing:0}
.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.option-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;min-height:112px;padding:15px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-soft)}
.option-card .oicon{width:39px;height:39px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--surface-2)}.option-card .oicon svg{width:22px;height:22px}
.option-card b{font-size:calc(14px * var(--fs));display:block;margin-top:10px}.option-card span{font-size:calc(10px * var(--fs));color:var(--ink-soft);display:block;margin-top:2px}
.option-card.selected{border-color:var(--primary);box-shadow:0 0 0 2px rgba(184,79,50,.13),var(--shadow-soft)}
.time-chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:17px 0}
.time-chip{min-height:58px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-family:"Noto Serif SC","STSong",serif;font-size:calc(20px * var(--fs));font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}

document.addEventListener('click', (e) => {
  const playEl = e.target.closest('[data-play-message]');
  if (playEl) { playMessage(playEl.dataset.playMessage); return; }
  const intentEl = e.target.closest('[data-intent]');
  if (intentEl) { session.voiceIntent = intentEl.dataset.intent; navigate('voice-reply'); return; }
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) { e.preventDefault(); handleAction(actionEl); return; }
  const routeEl = e.target.closest('[data-route]');
  if (routeEl) { e.preventDefault(); handleRoute(routeEl); }
});function playMessage(id) {
  if (session.playingMessage === id) {
    if (session.msgTimer) window.clearTimeout(session.msgTimer);
    session.playingMessage = null; render(); return;
  }
  if (session.msgTimer) window.clearTimeout(session.msgTimer);
  session.playingMessage = id;
  const msg = state.messages.find((m) => m.id === id);
  if (msg && !msg.heard) { msg.heard = true; save(); }
  const btn = document.querySelector(`[data-play-message="${id}"]`);
  if (btn) btn.innerHTML = `${ic('pause', 19)}<span class="dur">${msg?.duration || 0}s</span>`;
  const unread = btn?.closest('.message-card')?.querySelector('.unread'); if (unread) unread.remove();
  toast('正在播放留言');
  session.msgTimer = window.setTimeout(() => {
    if (routeNow() !== 'messages') return;
    session.playingMessage = null; toast('留言播放完了'); render();
  }, 2200);
}
function startRecording() {
  session.recording = true; session.recordReady = false; session.recordSeconds = 0; render();
}
function stopRecording() {
  if (!session.recording) return;
  session.recording = false; session.recordReady = true; session.recordDuration = Math.max(3, session.recordSeconds); render();
}
function handleMoreAction(a, el) {
  switch (a) {
    case 'call-contact': session.contact = el.dataset.contact || 'daughter'; session.callConnected = false; session.callSeconds = 0; session.callMuted = false; session.callVideo = true; session.callSpeaker = false; navigate('call'); break;
    case 'hangup': { const was = session.callConnected; const secs = session.callSeconds; session.callConnected = false; session.callSeconds = 0; if (was) toast(`通话结束 · ${pad2(Math.floor(secs / 60))}:${pad2(secs % 60)}`); navigate('family'); break; }
    case 'call-control': {
      const c = el.dataset.control;
      if (c === 'mute') session.callMuted = !session.callMuted;
      if (c === 'video') session.callVideo = !session.callVideo;
      if (c === 'speaker') session.callSpeaker = !session.callSpeaker;
      render(); break;
    }
    case 'msg-contact': session.recordRecipient = el.dataset.contact || 'daughter'; session.recording = false; session.recordReady = false; navigate('message-record'); break;
    case 'pick-recipient': session.recordRecipient = el.dataset.contact; session.recording = false; session.recordReady = false; render(); break;
    case 'toggle-record': if (session.recording) stopRecording(); else startRecording(); break;
    case 'reset-recording': session.recording = false; session.recordReady = false; session.recordSeconds = 0; session.recordDuration = 0; render(); break;
    case 'send-recording': {
      const c = CONTACTS[session.recordRecipient] || CONTACTS.daughter;
      state.messages.unshift({ id:'m' + Date.now(), from:'我', avatar:'grandma', to: session.recordRecipient, duration: session.recordDuration || 3, text:`给${c.name}的语音留言`, time:'刚刚', heard:true });
      save(); session.recordReady = false; session.recordDuration = 0; session.recordSeconds = 0; toast(`已经发给${c.name}了`); navigate('messages'); break;
    }
    case 'open-photo': session.photoIndex = Number(el.dataset.photo) || 0; navigate('photo'); break;
    case 'play-photo-note': speak(ALBUM[session.photoIndex]?.note || '这是一张家庭照片。', el); break;
    case 'favorite-photo': { const i = session.photoIndex; if (state.favorites.includes(i)) state.favorites = state.favorites.filter((x) => x !== i); else state.favorites.push(i); save(); toast(state.favorites.includes(i) ? '已收藏这张照片' : '已取消收藏'); render(); break; }
    case 'record-photo-note': session.recordRecipient = ALBUM[session.photoIndex]?.from === '建国' ? 'son' : 'daughter'; session.recording = false; session.recordReady = false; navigate('message-record'); break;
    case 'share-photo': if (navigator.clipboard) navigator.clipboard.writeText(location.href).catch(() => {}); toast('照片链接已复制，可以发给家人'); break;
    case 'bp-step': {
      const f = el.dataset.field, dir = Number(el.dataset.dir); const input = document.getElementById(`bp-${f}`); if (!input) break;
      const limits = { high:[70,250], low:[40,150], pulse:[30,200] };
      input.value = clamp((Number(input.value) || 0) + dir, limits[f][0], limits[f][1]); break;
    }
    case 'save-bp': {
      const high = Number($('#bp-high')?.value), low = Number($('#bp-low')?.value), pulse = Number($('#bp-pulse')?.value);
      if (!(high >= 70 && high <= 250 && low >= 40 && low <= 150 && pulse >= 30 && pulse <= 200)) { $('#bp-error')?.classList.add('show'); toast('数字好像不太对，再检查一下'); break; }
      $('#bp-error')?.classList.remove('show');
      state.bp = { high, low, pulse, date:`今天 ${nowTime()}` };
      state.bpHistory.unshift(Object.assign({}, state.bp)); state.bpHistory = state.bpHistory.slice(0, 8); save();
      toast(`已记录：${high}/${low} mmHg`); setT(() => navigate('health'), 450); break;
    }
    case 'toggle-med': { const m = state.meds.find((x) => x.id === el.dataset.id); if (m) { m.done = !m.done; save(); toast(m.done ? '已记下，做得很好' : '已取消完成'); render(); } break; }
    case 'set-mood': { const t = MOODS[el.dataset.mood] || MOODS.calm; state.mood = { type: el.dataset.mood, label: t.label }; save(); navigate('mood-result'); break; }
    case 'mood-listen': chooseMedia('老歌'); break;
    case 'health-steps': toast('今天已经走了 3,240 步，比昨天多一点'); break;
    case 'sos-reset': session.sosTriggered = false; session.sosHolding = false; toast('已取消求助'); navigate('health'); break;
    case 'set-font': state.font = el.dataset.value; save(); render(); toast('字体已经调好了'); break;
    case 'toggle-contrast': state.contrast = !state.contrast; save(); render(); toast(state.contrast ? '已打开高对比度' : '已恢复默认对比度'); break;
    case 'toggle-broadcast': state.voiceBroadcast = !state.voiceBroadcast; save(); render(); toast(state.voiceBroadcast ? '已打开自动朗读' : '已关闭自动朗读'); break;
    case 'edit-emergency': toast('演示中已固定为女儿小梅'); break;
  }
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (el) handleMoreAction(el.dataset.action, el);
});function init() {
  if (!location.hash) {
    try { history.replaceState(null, '', '#/' + (state.entered ? 'home' : 'welcome')); } catch (e) { location.hash = '#/welcome'; }
  }
  window.addEventListener('hashchange', render);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMap(); });
  const overlay = $('#page-map');
  if (overlay) overlay.addEventListener('click', (e) => { if (e.target === overlay) closeMap(); });
  render();
  updateClock();
  window.setInterval(updateClock, 30000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();</script>
